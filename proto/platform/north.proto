syntax = "proto3";

// =============================================================================
// Sharpa Platform North Proto
// =============================================================================
// 命名与单位规范以本文件头部约束为准。修改字段、message 或单位时必须先核对
// 下述规则，再提交本文件。
//
// 单位约束（必读）：
//   - 默认 SI 基本单位（m / s / rad / N / Nm / A / V / Hz / Pa），无后缀即 SI
//   - 时间字段强制后缀 _ns / _ms / _s（即便 s 也写出）
//   - 温度强制 _celsius（°C 非 SI）
//   - 百分比强制 _pct（0-100）
//   - 严禁 proto 中出现非 SI 遗留单位 _deg / _rpm / _ma / _mv / _kpa
//
// 后缀语义（严格）：
//   State    设备测得的当前状态（含 Header，周期上报）
//   Command  控制输入（多模式收敛到同一 message 的 oneof）
//   Status   健康/诊断（区别于物理 State）
//   Event    一次性事件
//   Info     慢变元信息
//   Frame    单帧多模态传感器载荷
//   Target   Command oneof 分支子结构
//   Bundle   显式聚合容器
//   Request / Response  RPC 载荷
// =============================================================================

package proto;

import "google/protobuf/timestamp.proto";

// =============================================================================
// SECTION 01  Common primitives  (Header / 几何 / 力学基元)
// =============================================================================

message Header {
  google.protobuf.Timestamp stamp = 1;
  string key                      = 2;   // 来源插件/设备实例标识
  string frame_id                 = 3;   // 数据所在坐标系
  google.protobuf.Timestamp sys_time = 4;
  uint32 seq                      = 5;
}

message Point      { float x = 1; float y = 2; float z = 3; }
message Vector2    { float x = 1; float y = 2; }
message Vector3    { float x = 1; float y = 2; float z = 3; }
message Quaternion { float w = 1; float x = 2; float y = 3; float z = 4; }

message Pose        { Point  position = 1; Quaternion orientation = 2; }
message PoseStamped { Header header   = 1; Pose pose = 2; }

message Twist        { Vector3 linear = 1; Vector3 angular = 2; }
message TwistStamped { Header  header = 1; Twist twist = 2; }

message Wrench        { Vector3 force = 1; Vector3 torque = 2; }
message WrenchStamped { Header header = 1; Wrench wrench = 2; }

message Transform {
  Vector3    translation = 1;
  Quaternion rotation    = 2;
}
message TransformStamped {
  Header    header         = 1;
  string    child_frame_id = 2;
  Transform transform      = 3;
}

// =============================================================================
// SECTION 02  Global enums
// =============================================================================

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_LEFT        = 1;
  SIDE_RIGHT       = 2;
}

enum TactileFinger {
  TACTILE_FINGER_UNSPECIFIED = 0;
  TACTILE_FINGER_THUMB       = 1;
  TACTILE_FINGER_INDEX       = 2;
  TACTILE_FINGER_MIDDLE      = 3;
  TACTILE_FINGER_RING        = 4;
  TACTILE_FINGER_LITTLE      = 5;
}

enum CameraMount {
  CAMERA_MOUNT_UNSPECIFIED = 0;
  CAMERA_MOUNT_HEAD_LEFT   = 1;
  CAMERA_MOUNT_HEAD_RIGHT  = 2;
  CAMERA_MOUNT_WRIST_LEFT  = 3;
  CAMERA_MOUNT_WRIST_RIGHT = 4;
}

enum SpaceMode {
  SPACE_MODE_UNSPECIFIED    = 0;
  SPACE_MODE_JOINT_SPACE    = 1;  // 关节空间控制
  SPACE_MODE_CARTESIAN_SPACE = 2; // 笛卡尔空间控制
}

// Runtime control modes shared by plugin status/service payloads. Values
// intentionally match sharpa::ArmControlMode; 0 is
// JointPosition for compatibility with existing arm mode service payloads.
enum ControlMode {
  CONTROL_MODE_JOINT_POSITION      = 0;
  CONTROL_MODE_JOINT_PD            = 1;
  CONTROL_MODE_JOINT_TORQUE        = 2;
  CONTROL_MODE_SPEED               = 3;
  CONTROL_MODE_FLOATING            = 4;
  CONTROL_MODE_MOTOR_PD            = 5;
  CONTROL_MODE_CARTESIAN_IMPEDANCE = 6;
}

enum LifecyclePhase {
  LIFECYCLE_PHASE_UNSPECIFIED = 0;
  LIFECYCLE_PHASE_INIT        = 1;
  LIFECYCLE_PHASE_STANDBY     = 2;
  LIFECYCLE_PHASE_RUNNING     = 3;
  LIFECYCLE_PHASE_ERROR       = 4;
  LIFECYCLE_PHASE_FATAL       = 5;
}

enum FaultLevel {
  FAULT_LEVEL_UNSPECIFIED = 0;
  FAULT_LEVEL_INFO        = 1;
  FAULT_LEVEL_WARNING     = 2;
  FAULT_LEVEL_ERROR       = 3;
  FAULT_LEVEL_FATAL       = 4;
}

// =============================================================================
// SECTION 03  Observe / Sensor primitives  (IMU / Image / Lidar / Radar / Camera)
// =============================================================================

// 设备 State 的具体来源、回退策略、后端例外及验证边界：sharpa_platform/docs/device-state-timestamps.md。
// Timestamp 以 seconds/nanos 编码；ns 单位不代表 ns 精度。集合最大值不证明同时采样或全部时间可用。
message Imu {
  // 本子项反馈时间（来源与基准见上述 Platform 时间语义文档）；零表示时间不可用，不代表数据无效。
  Header     header              = 1;
  Quaternion orientation         = 2;   // 原始姿态四元数
  Vector3    angular_velocity    = 3;   // rad/s
  Vector3    linear_acceleration = 4;   // m/s^2
  Quaternion aligned_orientation = 5;   // 重力对齐后的姿态
  // IMU/body 系重力方向单位向量（朝下）。由 orientation 推出：g = -R01^T*[0,0,1]；
  // 静止且 +Z 朝上时约 (0,0,-1)。无量纲，非 m/s^2。
  Vector3    gravity             = 6;
}

message ImuSamples {
  uint64     stamp_ns = 1;  // 当前所含子项已知时间最大值（ns）；全零/空为零，子项时间保留。
  repeated Imu imus   = 2;
}

enum UltrasonicDistanceStatus {
  ULTRASONIC_DISTANCE_STATUS_UNSPECIFIED = 0;
  ULTRASONIC_DISTANCE_STATUS_VALID       = 1;
  ULTRASONIC_DISTANCE_STATUS_NO_TARGET   = 2;
  ULTRASONIC_DISTANCE_STATUS_INTERFERENCE = 3;
  ULTRASONIC_DISTANCE_STATUS_NOT_READY   = 4;
  ULTRASONIC_DISTANCE_STATUS_INVALID     = 5;
}

message Ultrasonic {
  // 本响应数据时间；来源可为 MCU 组帧、传输或主机接收，零不代表距离无效。
  Header                   header              = 1;
  uint32                   distance_mm         = 2;
  uint32                   raw_value           = 3;
  float                    temperature_celsius = 4;
  UltrasonicDistanceStatus status              = 5;
  bool                     valid               = 6;
}

message UltrasonicSamples {
  uint64               stamp_ns    = 1;  // 当前所含子项已知时间最大值（ns）；全零/空为零，子项时间保留。
  repeated Ultrasonic  ultrasonics = 2;
}

message TactileSkinPoint {
  string serial_id = 1;  // "U6"
  uint32 row       = 2;
  uint32 col       = 3;
  float  force_n   = 4;  // 牛顿
}

message TactileSkin {
  // 与本块皮肤反馈配对的数据时间；零表示不可用，无逐触点时间。
  Header header      = 1;  // key=sensor_name, frame_id, seq=sequence_num
  repeated TactileSkinPoint points = 3;
  bool valid         = 4;
}

message TactileSkinSamples {
  uint64 stamp_ns = 1;  // 当前所含子项已知时间最大值（ns）；全零/空为零，子项时间保留。
  repeated TactileSkin skins = 2;
}

message Image {
  Header header        = 1;
  uint32 height        = 2;             // 像素
  uint32 width         = 3;             // 像素
  string encoding      = 4;             // "rgb8" / "bgr8" / "mono8" / ...
  uint32 step          = 5;             // bytes per row
  bool   is_bigendian  = 6;
  bytes  data          = 7;
}

message CompressedImage {
  Header header = 1;
  string format = 2;                    // "jpeg" / "png" / "h264"
  bytes  data   = 3;
}

// 单帧相机：colour / depth / IR 合并到同一 message，由可选字段决定包含哪些通道
message CameraFrame {
  // 腕部 JPEG：与 color.header.stamp 等值的帧数据时间；零表示不可用。其他挂载保持各自来源契约。
  Header          header     = 1;
  CameraMount     mount      = 2;
  CompressedImage color      = 3;       // 主彩色通道
  Image           depth      = 4;       // 深度（mm 或 m，按 encoding 区分）
  Image           ir         = 5;       // 红外
  CompressedImage color_left = 6;       // 立体相机左目
  CompressedImage color_right = 7;      // 立体相机右目
}

message PointField {
  string name      = 1;
  uint32 offset    = 2;
  uint32 datatype  = 3;
  uint32 count     = 4;
}

message PointCloud {
  Header              header       = 1;
  uint32              height       = 2;
  uint32              width        = 3;
  repeated PointField fields       = 4;
  bool                is_bigendian = 5;
  uint32              point_step   = 6;
  uint32              row_step     = 7;
  bytes               data         = 8;
  bool                is_dense     = 9;
}

// 激光雷达单点，坐标单位为 m。
message LidarPoint {
  float  x            = 1;
  float  y            = 2;
  float  z            = 3;
  uint32 reflectivity = 4;  // 当前设备有效范围 0-255
}

// JT16 同一方位角下的一组通道点。
message LaserShot {
  uint64              timestamp_ns = 1;  // 本扫描线数据时间（ns）；零表示不可用，事件不保证为物理采样。
  float               azimuth_rad  = 2;
  repeated LidarPoint points       = 3;
}

// JT16 一圈完整扫描。
message LaserShots {
  repeated LaserShot shots = 1;
}

// FTX140 单个 UDP 数据包对应的扫描区域。
message SubArea {
  uint64              timestamp_ns = 1;  // 本区域设备时间或主机接收时间（ns）；均不可用为零。
  uint32              row_id       = 2;
  uint32              column_id    = 3;
  repeated LidarPoint points       = 4;
}

// FTX140 一帧完整扫描。
message SubAreas {
  repeated SubArea subareas = 1;
}

// JT16 packed 传输：定长小端组头表 + 按 shot 顺序拼接的点表。
// shots：每条 16B = u64 timestamp_ns | f32 azimuth_rad | u16 point_count | u16 pad
// points：每点 16B = f32 x | f32 y | f32 z | u8 reflectivity | u8[3] pad（与 MsgLidarPoint 一致）
message PackedLaserShots {
  string compression = 1;  // "" | "zstd" | "lz4"；当前发布端只压缩 points
  uint32 shot_count  = 2;
  uint32 point_count = 3;
  bytes  shots       = 4;
  bytes  points      = 5;
}

// FTX140 packed 传输：定长小端组头表 + 按 subarea 顺序拼接的点表。
// subareas：每条 16B = u64 timestamp_ns | u16 row_id | u16 column_id | u16 point_count | u16 pad
// points：布局同 PackedLaserShots.points
message PackedSubAreas {
  string compression  = 1;  // "" | "zstd" | "lz4"；当前发布端只压缩 points
  uint32 subarea_count = 2;
  uint32 point_count   = 3;
  bytes  subareas      = 4;
  bytes  points        = 5;
}

// 单台激光雷达的一帧数据。
message LidarFrame {
  Header header   = 1;  // key=设备名，frame_id=坐标系，seq=设备独立帧序号
  uint64 stamp_ns = 2;  // 当前所含扫描线/区域已知时间最大值（ns）；全零/空为零，与 header.stamp 等值。
  oneof payload {
    LaserShots       laser_scan        = 3;  // JT16 旧明文，过渡期保留
    SubAreas         lidar_scan        = 4;  // FTX140 旧明文，过渡期保留
    PackedLaserShots packed_laser_scan = 5;  // JT16 packed + zstd
    PackedSubAreas   packed_lidar_scan = 6;  // FTX140 packed + zstd
  }
}

// 毫米波雷达
message RadarTrack {
  uint32  track_id = 1;
  Vector3 position = 2;                 // m，本体系
  Vector3 velocity = 3;                 // m/s
  float   rcs      = 4;                 // 反射截面 (dBsm)
  float   snr      = 5;                 // dB
}

message RadarFrame {
  Header              header = 1;
  string              sensor = 2;       // "front" / "rear" / ...
  repeated RadarTrack tracks = 3;
  PointCloud          cloud  = 4;
}

// =============================================================================
// SECTION 04  Tactile  (单触觉传感器多模态合并)
// =============================================================================

message TactileFrame {
  Header          header       = 1;
  Side            side         = 2;
  TactileFinger   finger       = 3;
  uint32          channel_id   = 4;     // 物理通道（追溯用，对应硬件 ch_0..ch_9）
  Wrench          force6d      = 5;     // 6D 力/力矩
  CompressedImage raw    = 6;     // 原图
  CompressedImage deform = 7;     // 变形图
  ContactPoints   contact_points = 8;   // 接触点，按 x/y/z 连续排列
}

message ContactPoints {
  Header         header      = 1;
  uint32         point_count = 2;
  repeated float points      = 3;       // x0,y0,z0,x1,y1,z1...
}

// =============================================================================
// SECTION 05  Joint primitive  (Arm / Hand / Torso 共用)
// =============================================================================

message JointState {
  repeated string name     = 1;
  repeated float  position = 2;         // rad（revolute）或 m（prismatic）
  repeated float  velocity = 3;         // rad/s 或 m/s
  repeated float  torque   = 4;         // Nm 或 N
}


message JointCommand {
  repeated string name        = 1;
  repeated float  position    = 2;
  repeated float  velocity    = 3;
  repeated float  torque      = 4;
}

message JointElectricalState {
  repeated string name                = 1;
  repeated float  temperature_celsius = 2;  // °C
  repeated float  current             = 3;  // A
  repeated float  bus_voltage         = 4;  // V
}

// =============================================================================
// SECTION 06  Arm
// =============================================================================

message ArmState {
  // UDP：当前启用轴反馈的已知时间最大值；全不可用为零，不代表逐轴完整性。CAN/tcp_sim 保留旧 tick。
  Header               header     = 1;
  Side                 side       = 2;
  Pose                 cartesian  = 3;            // TCP 位姿
  JointState           joints     = 4;
  Wrench               wrench     = 5;            // TCP 外力
  JointElectricalState electrical = 6;
}

message ArmCommand {
  Header        header = 1;
  Side          side   = 2;
  SpaceMode     mode   = 3;
  oneof target {
    JointCommand        joints     = 4;   // 关节空间
    Pose                cartesian  = 5;   // 笛卡尔单点
  }
}

// =============================================================================
// SECTION 07  Hand
// =============================================================================

message HandState {
  // Platform 首次接受本 SDK 快照的观察时间；来源见 Platform 时间戳规格，零表示不可用，缓存不重新打戳。
  Header               header     = 1;
  Side                 side       = 2;
  JointState           joints     = 3;
  JointElectricalState electrical = 4;
  repeated HandForceInfo force_info = 5;
}

message HandCommand {
  Header       header = 1;
  Side         side   = 2;
  SpaceMode    mode   = 3;
  JointCommand joints = 4;
}

// Glove teleop raw frame for action/{left,right}_glove/raw.
// Side is implied by topic. Carries joint-space HandCommand plus the glove-mounted
// Imu sample for the same frame. Downstream retarget uses hand; imu is optional
// but should be filled when the glove IMU is available.
message GloveRaw {
  Header      header = 1;
  HandCommand hand   = 2;  // required: joints.position length 22 (raw glove space)
  Imu         imu    = 3;  // optional: glove IMU aligned to this frame
}

message HandForceInfo {
  uint32 online              = 1;
  int32  strain_sensor_1     = 2;
  int32  strain_sensor_2     = 3;
  int32  strain_sensor_3     = 4;
  int32  strain_sensor_4     = 5;
  int32  torque_x            = 6;
  int32  torque_y            = 7;
  int32  force_z             = 8;
  int32  temperature_celsius = 9;
  int32  error_code          = 10;
}

// =============================================================================
// SECTION 08  Torso  (颈 3 + 身体 5)
// =============================================================================

message TorsoState {
  // 当前关节反馈的已知时间最大值；全不可用为零，不保证所有关节均有新反馈。
  Header               header     = 1;
  JointState           joints     = 2;         // 8 个关节
  JointElectricalState electrical = 3;
}

message TorsoCommand {
  Header      header = 1;
  SpaceMode   mode   = 2;
  oneof target {
    JointCommand     joints = 3;
  }
}

// Physical torso motor IDs 1..5 switch as one group. Position selects CSP
// frames (0x200); MIT selects impedance frames (0x210).
enum TorsoControlMode {
  TORSO_CONTROL_MODE_POSITION = 0;
  TORSO_CONTROL_MODE_MIT      = 1;
}

message TorsoModeRequest {
  Header            header = 1;
  TorsoControlMode  mode   = 2;
}

message TorsoModeResponse {
  bool              success       = 1;
  TorsoControlMode  previous_mode = 2;
  TorsoControlMode  current_mode  = 3;
  string            message       = 4;
}

// =============================================================================
// SECTION 09  Chassis  (4 轮 + 伸缩轴)
// =============================================================================

message ChassisState {
  // 当前有效反馈的主机接收时间最大值；全不可用为零，不是设备采样或发布时间。
  Header               header     = 1;
  Twist                velocity   = 2;   // 机器人基系下速度
  // 轴顺序：lf_drive lf_steer rf_drive rf_steer rr_drive rr_steer lr_drive lr_steer
  //         stretch_a stretch_b stretch_c stretch_d
  JointState           joints     = 3;
  JointElectricalState electrical = 4;
  // sharpa::ControlMode per joint (same order as joints)
  repeated uint32      joint_mode = 5;
}

/** 各关节目标量，轴序与 ChassisState.joints 一致；position rad, velocity rad/s, current A */
message ChassisTarget {
  Header header = 1;
  repeated float joint_target_position = 2;
  repeated float joint_target_velocity = 3;
  repeated float joint_target_current  = 4;
}

message ChassisCommand {
  Header header  = 1;
  float  vx      = 2;   // m/s 前向
  float  vy      = 3;   // m/s 横向
  float  vtheta  = 4;   // rad/s 自转
  float  v_l     = 5;   // m/s 轴距变化率（4DOF）
}

/** 原始关节旁路轨迹。A/B/C/D 与 chassis wheel_mappings 顺序一致；position rad, velocity rad/s, feedforward Nm */
message ChassisRawCommand {
  Header header = 1;

  float wheelA_position    = 2;
  float wheelA_velocity    = 3;
  float wheelA_feedforward = 4;
  float wheelB_position    = 5;
  float wheelB_velocity    = 6;
  float wheelB_feedforward = 7;
  float wheelC_position    = 8;
  float wheelC_velocity    = 9;
  float wheelC_feedforward = 10;
  float wheelD_position    = 11;
  float wheelD_velocity    = 12;
  float wheelD_feedforward = 13;

  float steerA_position    = 14;
  float steerA_velocity    = 15;
  float steerA_feedforward = 16;
  float steerB_position    = 17;
  float steerB_velocity    = 18;
  float steerB_feedforward = 19;
  float steerC_position    = 20;
  float steerC_velocity    = 21;
  float steerC_feedforward = 22;
  float steerD_position    = 23;
  float steerD_velocity    = 24;
  float steerD_feedforward = 25;
}

/** 3DOF 相对位姿命令：Δx/Δy/Δθ 相对当前估计位姿；flags bit0=cancel */
message ChassisPoseCommand {
  Header header           = 1;
  float  target_x_m       = 2;
  float  target_y_m       = 3;
  float  target_theta_rad = 4;
  float  v_max_mps        = 5;
  float  omega_max_rps    = 6;
  uint32 flags            = 7;
}

// Overall chassis mode. Heartbeat.control_mode carries these numbers for chassis,
// the same way torso heartbeat carries TorsoControlMode. Not part of ControlMode.
// MOTION: steer position, wheel speed. Stretch is unchanged.
// FORCE: steer force, wheel force. Stretch is unchanged.
enum ChassisControlMode {
  CHASSIS_CONTROL_MODE_MOTION = 0;
  CHASSIS_CONTROL_MODE_FORCE  = 1;
}

// Values match sharpa::control enumerations. Wheel request only accepts
// CLOSED_LOOP_SPEED and FORCE_CURRENT_MIT; other wheel strategies remain JSON-only.
enum ChassisCommandMode {
  CHASSIS_COMMAND_MODE_KINEMATIC = 0;
  CHASSIS_COMMAND_MODE_RAW       = 1;
}

enum ChassisSteerStrategy {
  CHASSIS_STEER_STRATEGY_CLOSED_LOOP_POSITION = 0;
  CHASSIS_STEER_STRATEGY_FORCE_CURRENT_MIT    = 1;
}

enum ChassisWheelStrategy {
  CHASSIS_WHEEL_STRATEGY_CLOSED_LOOP_SPEED = 0;
  CHASSIS_WHEEL_STRATEGY_FORCE_CURRENT_MIT = 1;
}

enum ChassisStretchStrategy {
  CHASSIS_STRETCH_STRATEGY_PROFILE_VELOCITY = 0;
  CHASSIS_STRETCH_STRATEGY_PROFILE_POSITION = 1;
}

message ChassisModeRequest {
  Header             header = 1;
  ChassisControlMode mode   = 2;
}

message ChassisModeResponse {
  bool               success       = 1;
  ChassisControlMode previous_mode = 2;
  ChassisControlMode current_mode  = 3;
  string             message       = 4;
}

message ChassisStrategyRequest {
  Header header = 1;
  optional ChassisCommandMode command_mode = 2;
  optional ChassisSteerStrategy steer = 3;
  optional ChassisWheelStrategy wheel = 4;
  optional ChassisStretchStrategy stretch = 5;
}

message ChassisStrategyResponse {
  bool success = 1;
  ChassisCommandMode command_mode = 2;
  ChassisSteerStrategy steer = 3;
  ChassisWheelStrategy wheel = 4;
  ChassisStretchStrategy stretch = 5;
  ChassisCommandMode previous_command_mode = 6;
  ChassisSteerStrategy previous_steer = 7;
  ChassisWheelStrategy previous_wheel = 8;
  ChassisStretchStrategy previous_stretch = 9;
  string message = 10;
}


// =============================================================================
// SECTION 11  Power & Safety
// =============================================================================

// Semantic power telemetry. Replaces the retired wire-oriented power state API.
// Readings carry a value ONLY when quality == POWER_DATA_VALID. Zero is a real value.
// Source clocks are never implicitly converted to Unix time. Topics publish at 10 Hz,
// including unavailable/stale states; consumers must also time out missing topic updates.
enum PowerDataQuality {
  POWER_DATA_UNSPECIFIED = 0;
  POWER_DATA_VALID = 1;
  POWER_DATA_NOT_RECEIVED = 2;
  POWER_DATA_STALE = 3;
  POWER_DATA_SOURCE_OFFLINE = 4;
  POWER_DATA_SENSOR_INVALID = 5;
  POWER_DATA_NOT_SUPPORTED = 6;
  POWER_DATA_UNVERIFIED = 7;
}
enum PowerClockDomain {
  POWER_CLOCK_UNKNOWN = 0;
  POWER_CLOCK_DEVICE_MONOTONIC = 1;
  POWER_CLOCK_GPTP = 2; // Synchronized domain; not necessarily Unix UTC.
}
enum PowerLinkState {
  POWER_LINK_UNKNOWN = 0;
  POWER_LINK_ONLINE = 1;
  POWER_LINK_OFFLINE = 2;
}
message PowerSampleMetadata {
  bool received = 1;
  bool transport_online = 2;
  PowerLinkState source_link = 3; // UNKNOWN when packet does not specify link status, or transport stale.
  google.protobuf.Timestamp received_at = 4; // Host UTC reception time of last accepted frame.
  uint64 receive_age_ms = 5; // Host monotonic elapsed time, not device sampling age.
  uint64 sample_time_ns = 6;
  uint64 envelope_time_ns = 7;
  PowerClockDomain clock_domain = 8;
  uint32 envelope_seq = 9;
  uint32 sample_seq = 10;
}
message PowerVoltageReading {
  optional float value = 1; // V; absent unless VALID.
  PowerDataQuality quality = 2;
  uint64 sample_time_ns = 3; // Device clock specified by enclosing metadata.
}
message PowerCurrentReading {
  optional float value = 1; // A; absent unless VALID.
  PowerDataQuality quality = 2;
  uint64 sample_time_ns = 3; // Device clock specified by enclosing metadata.
}
message PowerTemperatureReading {
  optional float celsius = 1; // degrees Celsius; absent unless VALID.
  PowerDataQuality quality = 2;
  uint64 sample_time_ns = 3; // Device clock specified by enclosing metadata.
}
message PowerPercentageReading {
  optional float pct = 1; // percent, 0..100; absent unless VALID.
  PowerDataQuality quality = 2;
  uint64 sample_time_ns = 3; // Device clock specified by enclosing metadata.
}
message PowerPowerReading {
  optional float value = 1; // W; absent unless VALID.
  PowerDataQuality quality = 2;
  uint64 sample_time_ns = 3; // Device clock specified by enclosing metadata.
}
enum ChestPowerOperatingState {
  CHEST_POWER_UNSPECIFIED = 0;
  CHEST_POWER_MONITOR_ONLY = 1;
  CHEST_POWER_BOOT_WAIT = 2;
  CHEST_POWER_STANDBY = 3;
  CHEST_POWER_RUNNING = 4;
  CHEST_POWER_FAULT = 5;
}
message ChestPowerOutputs {
  optional bool thor_24v_enabled = 1;
  optional bool left_arm_48v_enabled = 2;
  optional bool right_arm_48v_enabled = 3;
  optional bool ftx_12v_enabled = 4;
  optional bool mcu_15v_buck_enabled = 5;
  optional bool audio_15v_enabled = 6;
  // GPIO output readback, not confirmation that voltage is good.
}
message ChestPowerDiagnostics {
  uint32 flags = 1; // bit0 TIME_SYNCED; remaining bits reserved, not fault codes.
  uint32 adc_update_seq = 2;
  uint32 last_adc_channel = 3;
  uint32 sequence_phase_code = 4; // Firmware phase enum not yet version-verified.
  PowerCurrentReading current_channel_6 = 5; // LARM_ISENSE; physical assignment unconfirmed.
  PowerCurrentReading current_channel_7 = 6; // RARM_ISENSE; physical assignment unconfirmed.
}
message ChassisPowerDiagnostics {
  repeated PowerTemperatureReading reserved_ntc = 1; // N1..N4; no functional fault implied by absence.
  repeated PowerVoltageReading battery_switch_inputs = 2; // Input 1,2 pin voltages ONLY.
  // Firmware has no support/valid bit for switch inputs. Quality UNVERIFIED, value absent.
  repeated float reported_battery_switch_voltage = 3; // Last wire observations (V), possibly unimplemented zero.
}
message ChestPowerState {
  Header header = 1; // stamp is HOST publication UTC. key is configured device name.
  PowerSampleMetadata sample = 2;
  PowerVoltageReading motor_15v_voltage = 10; // Motor 15V bus; voltage ch0.
  PowerVoltageReading thor_24v_voltage = 11; // Thor 24V input; voltage ch1.
  PowerVoltageReading buck_24v_voltage = 12; // 24V buck output; voltage ch2.
  PowerVoltageReading input_48v_voltage = 13; // 48V input; voltage ch3.
  PowerVoltageReading left_arm_voltage = 14; // Left arm 48V; voltage ch4.
  PowerVoltageReading right_arm_voltage = 15; // Right arm 48V; voltage ch5.
  PowerVoltageReading audio_15v_voltage = 16; // Audio 15V; voltage ch6.
  PowerVoltageReading ftx_12v_voltage = 17; // FTX 12V; voltage ch7.
  PowerCurrentReading input_48v_current = 18; // 48V input total current; current ch0.
  PowerCurrentReading bus_24v_current = 19; // 24V bus current; ch1, not necessarily Thor alone.
  PowerCurrentReading left_arm_current = 20; // Left arm 48V; current ch4.
  PowerCurrentReading right_arm_current = 21; // Right arm 48V; current ch5.
  PowerTemperatureReading left_arm_efuse_temperature = 22; // TMP0 / 0x48.
  PowerTemperatureReading right_arm_efuse_temperature = 23; // TMP1 / 0x49.
  PowerTemperatureReading buck_24v_mos_temperature = 24; // TMP2 / 0x4a.
  PowerTemperatureReading efuse_24v_temperature = 25; // TMP3 / 0x4b.
  PowerTemperatureReading buck_15_36v_mos_temperature = 26; // TMP4 / 0x4c.
  PowerTemperatureReading imu_ambient_temperature = 27; // TMP5 / 0x4d.
  ChestPowerOperatingState operating_state = 3;
  ChestPowerOutputs outputs = 4;
  optional bool switching = 5;
  ChestPowerDiagnostics diagnostics = 6;
}
message ChassisPowerState {
  Header header = 1; // stamp is HOST publication UTC. key is configured device name.
  PowerSampleMetadata sample = 2;
  PowerVoltageReading bus_48v_voltage = 10; // V48: 48V bus.
  PowerVoltageReading precharge_voltage = 11; // VCHARGE: precharge voltage, not battery charging voltage.
  PowerVoltageReading upper_body_voltage = 12; // V_UL.
  PowerVoltageReading chassis_voltage = 13; // V_MB.
  PowerVoltageReading lower_body_voltage = 14; // V_LL.
  PowerCurrentReading chassis_current = 15; // MB current.
  PowerCurrentReading lower_body_current = 16; // LL current.
  PowerCurrentReading upper_body_current = 17; // Wire name THOR; physical meaning is upper-body current.
  PowerCurrentReading buck_24v_output_current = 18; // 24V buck output current.
  PowerTemperatureReading upper_body_switch_temperature = 19; // TUL: upper-body TPS.
  PowerTemperatureReading lower_body_switch_temperature = 20; // TLL: lower-body TPS.
  PowerTemperatureReading chassis_switch_temperature = 21; // TMB: chassis TPS.
  PowerVoltageReading stm32_analog_supply_voltage = 22; // STM32 VDDA.
  PowerVoltageReading stm32_vbat_voltage = 23; // STM32 telemetry VBAT test point; do not equate with traction pack voltage.
  PowerTemperatureReading stm32_die_temperature = 24; // STM32 die.
  PowerVoltageReading peripheral_3v3_voltage = 25; // VDD3V3_PERI; flags bit9.
  PowerVoltageReading local_12v_voltage = 26; // CM7 local ADC, independent of STM32 SPI.
  PowerVoltageReading local_5v_voltage = 27; // CM7 local ADC.
  PowerVoltageReading local_3v3_voltage = 28; // CM7 local ADC.
  PowerVoltageReading local_0v9_voltage = 29; // CM7 local ADC.
  ChassisPowerDiagnostics diagnostics = 3;
}
message BatteryPackDiagnostics {
  optional uint32 fault_code = 1; // Vendor register; not decoded without vendor codebook.
  optional uint32 alarm_code = 2;
  optional uint32 protection_code = 3;
  optional float reported_capacity_coulomb = 4; // Wire capacity *36 C; remaining/full/rated meaning UNCONFIRMED.
  // No healthy boolean is inferred from these undecoded registers.
}
message BatteryPackState {
  uint32 pack_id = 1; // 0=RS485 0x16; 1=0x17, stable even when unavailable.
  PowerLinkState online = 2; // UNKNOWN if transport stale or CM7/STM32 link down.
  PowerDataQuality quality = 3;
  repeated PowerTemperatureReading cell_temperatures = 4; // Probe indices 0..3, not anatomical locations.
  repeated PowerTemperatureReading mos_temperatures = 5; // Probe indices 0..1.
  BatteryPackDiagnostics diagnostics = 6;
  PowerVoltageReading voltage = 10; // Pack voltage.
  PowerCurrentReading current = 11; // Positive charging, negative discharging.
  PowerPercentageReading soc = 12; // State of charge, 0..100 percent.
  PowerPercentageReading soh = 13; // State of health, 0..100 percent.
  PowerVoltageReading minimum_cell_voltage = 14; // Minimum cell voltage.
  PowerVoltageReading maximum_cell_voltage = 15; // Maximum cell voltage.
  PowerPowerReading charge_power_limit = 16; // Allowed charging power, not measured power (BMS protocol).
  PowerPowerReading discharge_power_limit = 17; // Allowed discharging power, not measured power.
  PowerTemperatureReading ambient_temperature = 18; // Ambient temperature.
}
message BatterySystemState {
  Header header = 1; // Host publication UTC.
  PowerSampleMetadata sample = 2;
  repeated BatteryPackState packs = 3; // Always two entries, identified by pack_id.
}

message BatteryState {
  Header header              = 1;
  uint32 battery_id          = 2;
  float  voltage             = 3;       // V
  float  current             = 4;       // A
  uint32 capacity_pct        = 5;       // %
  uint32 status_code         = 6;
}

message EstopState {
  Header header = 1;
  uint32 state  = 2;                    // 0=IDLE, 1=ACTIVE, 2=RELEASED
  uint32 count  = 3;
}

message MosState {
  uint32 mos_id              = 1;
  float  voltage             = 2;       // V
  float  current             = 3;       // A
  float  temperature_celsius = 4;       // °C
  uint32 estop_state         = 5;
  uint32 error_code          = 6;
}

message FanState {
  uint32 fan_id     = 1;
  uint32 speed_pct  = 2;                // %
  uint32 error_code = 3;
}

message PowerPgState {
  uint32          total_pg_status  = 1;
  uint32          charge_pg_status = 2;
  repeated uint32 pg_pins          = 3;
}

