// ---- OTA orchestration ----------------------------------------------------

// Agent-to-peripheral-execution action contract.
//
// The Agent owns a durable action_id and verified, pinned artifact paths. The
// peripheral domain owns physical topology, preflight, retry, and verification,
// and exposes only an aggregate action state. The three request/response pairs
// are used on service/ota/submit, service/ota/status, and service/ota/versions.
// Do not add rollback, restore, direction, recovery-mode, cancel, retry,
// per-target status, or another task identity to this contract.
//
// Submit treats targets as an unordered set keyed by (plugin, component).
// Empty fields and duplicate keys are INVALID_REQUEST. The same action_id with
// the same normalized set is idempotent and returns OK; the same action_id
// with a different set returns CONFLICT. A different action_id while an action
// is non-terminal returns BUSY. The executor owns these checks.

enum OtaResult {
  OTA_RESULT_UNSPECIFIED     = 0;
  OTA_RESULT_OK              = 1;
  OTA_RESULT_INVALID_REQUEST = 2;
  OTA_RESULT_BUSY            = 3;
  OTA_RESULT_NOT_FOUND       = 4;
  OTA_RESULT_CONFLICT        = 5;
  OTA_RESULT_UNAVAILABLE     = 6;
}

enum OtaTaskState {
  OTA_TASK_STATE_UNSPECIFIED = 0;
  OTA_TASK_STATE_QUEUED      = 1;
  OTA_TASK_STATE_RUNNING     = 2;
  OTA_TASK_STATE_SUCCEEDED   = 3;
  OTA_TASK_STATE_FAILED      = 4;
}

// Stable, provider-independent causes for a failed peripheral target. The
// UNSPECIFIED zero value is a wire default and is invalid in a present failure
// report. Consumers must reject unknown values rather than infer a cause from
// diagnostic text.
enum OtaPeripheralFailureReason {
  OTA_PERIPHERAL_FAILURE_REASON_UNSPECIFIED            = 0;
  OTA_PERIPHERAL_FAILURE_REASON_PACKAGE_INVALID        = 1;
  OTA_PERIPHERAL_FAILURE_REASON_TARGET_UNSUPPORTED     = 2;
  OTA_PERIPHERAL_FAILURE_REASON_DEPENDENCY_UNAVAILABLE = 3;
  OTA_PERIPHERAL_FAILURE_REASON_PRECONDITION_FAILED    = 4;
  OTA_PERIPHERAL_FAILURE_REASON_TRANSFER_FAILED        = 5;
  OTA_PERIPHERAL_FAILURE_REASON_ACTIVATION_FAILED      = 6;
  OTA_PERIPHERAL_FAILURE_REASON_VERIFICATION_FAILED    = 7;
  OTA_PERIPHERAL_FAILURE_REASON_EXECUTION_TIMED_OUT    = 8;
  OTA_PERIPHERAL_FAILURE_REASON_PROTOCOL_INVALID       = 9;
  OTA_PERIPHERAL_FAILURE_REASON_EXECUTION_FAILED       = 10;
}

message OtaTarget {
  string plugin    = 1;
  string component = 2;
  // Agent-owned verified artifact path, pinned until the action converges.
  string file_path = 3;
}

message OtaSubmitRequest {
  string              action_id = 1;
  repeated OtaTarget  targets   = 2;
}

message OtaSubmitResponse {
  OtaResult result  = 1;
  string    message = 2;  // diagnostic, at most 1024 UTF-8 bytes
}

message OtaStatusRequest {
  string action_id = 1;
}

message OtaComponentFailure {
  // Exact submitted identities. Component is empty only for a plugin-wide
  // failure; both identities are empty only for a coordinator-wide failure.
  string                     plugin    = 1;
  string                     component = 2;
  OtaPeripheralFailureReason reason    = 3;
  // Optional source-redacted diagnostic, at most 160 UTF-8 bytes.
  string                     detail    = 4;
}

message OtaFailureReport {
  repeated OtaComponentFailure failures = 1;
}

// Independent proof for every side effect of the complete peripheral action.
enum OtaEffectClosure {
  OTA_EFFECT_CLOSURE_UNSPECIFIED = 0;
  OTA_EFFECT_CLOSURE_CONFIRMED_CLOSED = 1;
  OTA_EFFECT_CLOSURE_UNCONFIRMED = 2;
}

message OtaTaskStatus {
  OtaTaskState state            = 1;
  uint32       progress_percent = 2;  // observational only, 0..100
  string       message          = 3;  // diagnostic, at most 1024 UTF-8 bytes
  // Present and nonempty exactly when state is OTA_TASK_STATE_FAILED. Reports
  // on other states, or a failed state without failures, are invalid.
  OtaFailureReport failure_report = 4;
  // QUEUED/RUNNING: UNSPECIFIED; SUCCEEDED: CONFIRMED_CLOSED;
  // FAILED: CONFIRMED_CLOSED or UNCONFIRMED. Missing terminal closure,
  // unknown state/closure, or invalid failure_report invalidates the WHOLE
  // status. Terminal results are frozen; late evidence cannot upgrade them.
  OtaEffectClosure effect_closure = 5;
}

message OtaStatusResponse {
  OtaResult     result  = 1;
  OtaTaskStatus status  = 2;
  string        message = 3;  // diagnostic, at most 1024 UTF-8 bytes
}

message OtaComponentRef {
  string plugin    = 1;
  string component = 2;
}

message OtaVersionRequest {
  repeated OtaComponentRef components = 1;
}

message OtaComponentVersionResult {
  string    plugin    = 1;
  string    component = 2;
  OtaResult result    = 3;
  // Set only when result is OK. It is empty for a failed component query.
  string    version   = 4;
  // Per-component diagnostic; callers must branch on result, not this text.
  string    message   = 5;
}

message OtaVersionResponse {
  // OK requires one reliable logical version for every requested component.
  // A non-OK response still carries every component result that the OTA
  // service could identify.
  // NOT_FOUND means a requested plugin/component is not an OTA capability of
  // this Platform release. UNAVAILABLE means the capability is known but its
  // version cannot currently be read reliably. INVALID_REQUEST is reserved
  // for malformed requests; callers must not branch on diagnostic message.
  OtaResult                           result            = 1;
  repeated OtaComponentVersionResult  component_results = 2;
  string                              message           = 3;  // overall diagnostic, at most 1024 UTF-8 bytes
}

// ---- Agent-owned Platform OTA task intake ---------------------------------
// Distinct from peripheral plugin OTA above (local file_path targets).
// Frozen Zenoh keys:
//   service/ota/agent/submit
//   service/ota/agent/status
//   service/ota/agent/system-version
// Maintenance observation (no enter RPC in this contract):
//   state/system/master -> MasterStatus.phase == MASTER_PHASE_OTA
// Do not add release_id, TUF metadata, or trust-root fields to these messages.

enum OtaAgentSubmitResult {
  OTA_AGENT_SUBMIT_RESULT_UNSPECIFIED          = 0;
  OTA_AGENT_SUBMIT_RESULT_CREATED              = 1;
  OTA_AGENT_SUBMIT_RESULT_EXISTING             = 2;
  OTA_AGENT_SUBMIT_RESULT_INVALID_REQUEST      = 3;
  OTA_AGENT_SUBMIT_RESULT_BUSY                 = 4;
  OTA_AGENT_SUBMIT_RESULT_IDEMPOTENCY_CONFLICT = 5;
  OTA_AGENT_SUBMIT_RESULT_SERVICE_UNAVAILABLE  = 6;
}

enum OtaAgentStatusResult {
  OTA_AGENT_STATUS_RESULT_UNSPECIFIED         = 0;
  OTA_AGENT_STATUS_RESULT_OK                  = 1;
  OTA_AGENT_STATUS_RESULT_NOT_FOUND           = 2;
  OTA_AGENT_STATUS_RESULT_INVALID_REQUEST     = 3;
  OTA_AGENT_STATUS_RESULT_SERVICE_UNAVAILABLE = 4;
  // A valid current-task query observed no active task. No other result value
  // has idle semantics.
  OTA_AGENT_STATUS_RESULT_NO_ACTIVE_TASK      = 5;
}

enum OtaAgentTerminalResult {
  OTA_AGENT_TERMINAL_RESULT_UNSPECIFIED       = 0;
  OTA_AGENT_TERMINAL_RESULT_REJECTED          = 1;
  OTA_AGENT_TERMINAL_RESULT_FAILED            = 2;
  OTA_AGENT_TERMINAL_RESULT_COMMITTED         = 3;
  OTA_AGENT_TERMINAL_RESULT_RESTORED_BASELINE = 4;
  OTA_AGENT_TERMINAL_RESULT_NEEDS_SERVICE     = 5;
  // Preparation succeeded. This is not installed-version or cache authority.
  OTA_AGENT_TERMINAL_RESULT_DOWNLOADED        = 6;
  OTA_AGENT_TERMINAL_RESULT_CANCELLED         = 7;
}

enum OtaAgentCompletionProvenance {
  OTA_AGENT_COMPLETION_PROVENANCE_UNSPECIFIED       = 0;
  OTA_AGENT_COMPLETION_PROVENANCE_UPDATED           = 1;
  OTA_AGENT_COMPLETION_PROVENANCE_ALREADY_SATISFIED = 2;
}

enum OtaAgentTaskKind {
  OTA_AGENT_TASK_KIND_UNSPECIFIED = 0;
  OTA_AGENT_TASK_KIND_INSTALL = 1;
  OTA_AGENT_TASK_KIND_DOWNLOAD_ONLY = 2;
}

// Only service/ota/agent/download accepts this operation. An unavailable
// operation must never cause a client to fall back to ordinary submit.
message OtaAgentDownloadRequest {
  string request_id = 1;
  string release_version = 2;
  string product_code = 3;
}

// Only service/ota/agent/cancel accepts this operation.
// Cancellation applies only to DownloadOnly and selects an exact request.
// ACCEPTED means intent is durable; final status becomes CANCELLED only after
// the old writer and checker have exited. Retry this operation after reply loss.
message OtaAgentCancelRequest { string request_id = 1; }
enum OtaAgentCancelResult {
  OTA_AGENT_CANCEL_RESULT_UNSPECIFIED = 0;
  OTA_AGENT_CANCEL_RESULT_ACCEPTED = 1;
  OTA_AGENT_CANCEL_RESULT_ALREADY_TERMINAL = 2;
  OTA_AGENT_CANCEL_RESULT_NOT_FOUND = 3;
  OTA_AGENT_CANCEL_RESULT_NOT_DOWNLOAD_ONLY = 4;
  OTA_AGENT_CANCEL_RESULT_INVALID_REQUEST = 5;
  OTA_AGENT_CANCEL_RESULT_SERVICE_UNAVAILABLE = 6;
}
message OtaAgentCancelResponse {
  OtaAgentCancelResult result = 1;
  string request_id = 2;
  string task_id = 3;
  OtaAgentTerminalResult terminal_result = 4;
}

message OtaAgentSubmitRequest {
  string request_id      = 1;
  string release_version = 2;
  // Required. Together with release_version, this is the immutable release
  // identity bound to request_id. Consumers must reject an empty value and
  // must not fill it from device configuration.
  string product_code    = 3;
}

message OtaAgentSubmitResponse {
  OtaAgentSubmitResult result             = 1;
  string               request_id         = 2;
  string               release_version    = 3;
  string               task_id            = 4;
  string               reason_code        = 5;
  string               diagnostic_summary = 6;  // bounded; no free-text manifest dump
  string               product_code       = 7;
}

message OtaAgentStatusRequest {
  // A nonempty value selects the exact historical request. The canonical
  // default message (present zero-byte payload) selects the current task.
  string request_id = 1;
}

message OtaAgentPeripheralFailureSummary {
  string                     plugin = 1;
  OtaPeripheralFailureReason reason = 2;
}

message OtaAgentStatusResponse {
  OtaAgentStatusResult         result                = 1;
  string                       request_id            = 2;
  string                       release_version       = 3;
  string                       task_id               = 4;
  OtaAgentTerminalResult       terminal_result       = 5;
  string                       reason_code           = 6;
  string                       product_code          = 7;
  OtaAgentCompletionProvenance completion_provenance = 8;
  OtaTaskProgress              task_progress         = 9;
  // Stable public summaries only. Component identity, diagnostic detail, and
  // forward/recovery phase remain private or are represented by reason_code.
  repeated OtaAgentPeripheralFailureSummary peripheral_failures = 10;
  OtaAgentTaskKind task_kind = 11;
}

// Agent-owned product-domain version query. This is distinct from
// OtaVersion*, which remains the Platform-owned peripheral-version contract.
message OtaAgentSystemVersionRequest {
  string product_code = 1;
}

message OtaAgentSystemVersionResponse {
  OtaResult result          = 1;
  string    product_code    = 2;
  string    release_version = 3;
  string    message         = 4;  // diagnostic, at most 1024 UTF-8 bytes
}

// Read-only Agent module-version report, served by
// service/ota/agent/module-versions. No task identity or durable side effect.
message OtaAgentModuleVersionsRequest {
  // Absent: fresh inventory. Present: conformance to this product's last
  // committed release. Present empty or invalid identifiers are INVALID_REQUEST.
  optional string product_code = 1;
}

message OtaAgentModuleVersionsResponse {
  // OK means collection completed, including partial or mismatched reports.
  // OK requires report; non-OK requires no report and a stable error_code.
  OtaResult result = 1;
  OtaAgentModuleVersionsReport report = 2;
  string error_code = 3;
  string message = 4; // at most 1024 UTF-8 bytes; empty on OK
  optional string product_code = 5; // selected product on authority errors only
}

// Inventory omits product/release/conformance fields and expected versions.
// Conformance carries these fields and lists only the committed target set.
message OtaAgentModuleVersionsReport {
  optional string product_code = 1;
  optional string release_version = 2;
  optional OtaAgentModuleConformanceStatus conformance_status = 3;
  repeated OtaAgentModuleVersion components = 4;
  repeated OtaAgentModuleDiagnostic diagnostics = 5; // inventory only
}

message OtaAgentModuleVersion {
  string module_code = 1;
  OtaAgentModuleVersionStatus status = 2;
  optional string observed_version = 3;
  optional string expected_version = 4; // conformance only
  optional string reason = 5; // at most 1024 UTF-8 bytes
}

// Same outcomes as the versions CLI. Firmware Conflict remains ERROR with a
// diagnostic reason; it is not a distinct observation or a release mismatch.
enum OtaAgentModuleVersionStatus {
  OTA_AGENT_MODULE_VERSION_STATUS_UNSPECIFIED = 0;
  OTA_AGENT_MODULE_VERSION_STATUS_OBSERVED = 1; // inventory only
  OTA_AGENT_MODULE_VERSION_STATUS_MATCHED = 2; // conformance only
  OTA_AGENT_MODULE_VERSION_STATUS_MISMATCHED = 3; // conformance only
  OTA_AGENT_MODULE_VERSION_STATUS_UNAVAILABLE = 4;
  OTA_AGENT_MODULE_VERSION_STATUS_UNSUPPORTED = 5;
  OTA_AGENT_MODULE_VERSION_STATUS_ERROR = 6;
}

enum OtaAgentModuleConformanceStatus {
  OTA_AGENT_MODULE_CONFORMANCE_STATUS_UNSPECIFIED = 0;
  OTA_AGENT_MODULE_CONFORMANCE_STATUS_MATCHED = 1;
  OTA_AGENT_MODULE_CONFORMANCE_STATUS_MISMATCHED = 2;
  OTA_AGENT_MODULE_CONFORMANCE_STATUS_INCONCLUSIVE = 3;
}

// Peripheral-versions provider diagnostics, including whole-service failures
// and plugin-level failures that cannot be assigned to a specific component.
// Their presence does not mean all peripheral versions are unavailable.
// Identified component outcomes remain on the corresponding module.
// Diagnostic status is restricted to UNAVAILABLE or ERROR.
message OtaAgentModuleDiagnostic {
  OtaAgentModuleVersionStatus status = 1;
  string reason = 2; // at most 1024 UTF-8 bytes
}

enum OtaPublicTaskState {
  OTA_PUBLIC_TASK_STATE_UNSPECIFIED   = 0;
  OTA_PUBLIC_TASK_STATE_PENDING       = 1;
  OTA_PUBLIC_TASK_STATE_RUNNING       = 2;
  OTA_PUBLIC_TASK_STATE_RECOVERING    = 3;
  OTA_PUBLIC_TASK_STATE_SUCCEEDED     = 4;
  OTA_PUBLIC_TASK_STATE_FAILED        = 5;
  OTA_PUBLIC_TASK_STATE_NEEDS_SERVICE = 6;
  OTA_PUBLIC_TASK_STATE_RESTORED_BASELINE = 7;
}

enum OtaPublicStageState {
  OTA_PUBLIC_STAGE_STATE_UNSPECIFIED = 0;
  OTA_PUBLIC_STAGE_STATE_PENDING     = 1;
  OTA_PUBLIC_STAGE_STATE_RUNNING     = 2;
  OTA_PUBLIC_STAGE_STATE_SUCCEEDED   = 3;
  OTA_PUBLIC_STAGE_STATE_FAILED      = 4;
  OTA_PUBLIC_STAGE_STATE_SKIPPED     = 5;
}

enum OtaStageOperation {
  OTA_STAGE_OPERATION_UNSPECIFIED = 0;
  OTA_STAGE_OPERATION_SETUP       = 1;
  OTA_STAGE_OPERATION_TRANSFERRING = 2;
  OTA_STAGE_OPERATION_INSTALLING  = 3;
  OTA_STAGE_OPERATION_RESTARTING  = 4;
  OTA_STAGE_OPERATION_VERIFYING   = 5;
  OTA_STAGE_OPERATION_RECOVERING  = 6;
}

enum OtaStageTarget {
  OTA_STAGE_TARGET_UNSPECIFIED = 0;
  OTA_STAGE_TARGET_TASK        = 1;
  OTA_STAGE_TARGET_PLATFORM    = 2;
  OTA_STAGE_TARGET_PERIPHERALS = 3;
  OTA_STAGE_TARGET_AGENT       = 4;
  OTA_STAGE_TARGET_THOR_BSP    = 5;
}

message OtaStageProgress {
  // A monotonic, comparable measure of work for this stage only. Clients must
  // use completed / total only; total == 0 means no reliable measure exists.
  uint64 completed = 1;
  uint64 total = 2;
}

message OtaPublicStage {
  OtaStageOperation operation = 1;
  OtaStageTarget target = 2;
  OtaPublicStageState state = 3;
  OtaStageProgress progress = 4;
}

message OtaStageSummary {
  OtaStageOperation operation = 1;
  OtaStageTarget target = 2;
  OtaPublicStageState state = 3;
}

message OtaTaskProgress {
  OtaPublicTaskState state = 1;
  uint32 current_stage_index = 2;
  uint32 stage_count = 3;
  OtaPublicStage current_stage = 4;
  repeated OtaStageSummary stages = 5;
  uint32 interrupted_stage_index = 6;
}

// User configuration. Query presence denotes confirmed values; writes may be unavailable.
enum ConfigValueType {
  CONFIG_VALUE_TYPE_UNSPECIFIED = 0;
  CONFIG_VALUE_TYPE_BOOL = 1;
  CONFIG_VALUE_TYPE_INTEGER = 2;
  CONFIG_VALUE_TYPE_DOUBLE = 3;
  CONFIG_VALUE_TYPE_STRING = 4;
  CONFIG_VALUE_TYPE_ARRAY = 5;
}
enum ConfigApplyPolicy {
  CONFIG_APPLY_POLICY_UNSPECIFIED = 0;
  CONFIG_APPLY_POLICY_IMMEDIATE = 1;
  CONFIG_APPLY_POLICY_SAFE_STATE = 2;
  CONFIG_APPLY_POLICY_INIT_ONLY = 3;
}
enum ConfigOperation {
  CONFIG_OPERATION_UNSPECIFIED = 0;
  CONFIG_OPERATION_SET = 1;
  CONFIG_OPERATION_RESET = 2;
}
enum ConfigOverrideStatus {
  CONFIG_OVERRIDE_STATUS_UNSPECIFIED = 0;
  CONFIG_OVERRIDE_STATUS_NONE = 1;
  CONFIG_OVERRIDE_STATUS_APPLIED = 2;
  CONFIG_OVERRIDE_STATUS_PENDING_INIT = 3;
  CONFIG_OVERRIDE_STATUS_NOT_ADOPTED = 4;
}
enum ConfigResult {
  CONFIG_RESULT_UNSPECIFIED = 0;
  CONFIG_RESULT_OK = 1;
  CONFIG_RESULT_INVALID_REQUEST = 2;
  CONFIG_RESULT_INSTANCE_UNAVAILABLE = 3;
  CONFIG_RESULT_VALIDATION_REJECTED = 4;
  CONFIG_RESULT_BUSY = 5;
  CONFIG_RESULT_SAFETY_CONDITION_UNMET = 6;
  CONFIG_RESULT_STORAGE_FAILED_UNCHANGED = 7;
  CONFIG_RESULT_APPLY_FAILED_UNCHANGED = 8;
  CONFIG_RESULT_FAILED_RESTORED = 9;
  CONFIG_RESULT_RECOVERY_REQUIRED = 10;
  CONFIG_RESULT_RESOURCE_LIMIT = 11;
}
message ConfigDoubleArray { repeated double values = 1; }
message ConfigIntegerArray { repeated sint64 values = 1; }
message ConfigValue {
  oneof value {
    bool bool_value = 1;
    sint64 int_value = 2;
    double double_value = 3;
    string string_value = 4;
    string raw_json_value = 5;
    ConfigDoubleArray double_array_value = 6;
    ConfigIntegerArray integer_array_value = 7;
  }
}
message ConfigEnumOption { int64 value = 1; string name = 2; }
message ConfigConstraints {
  optional double minimum = 1;
  optional double maximum = 2;
  bool minimum_exclusive = 3;
  bool maximum_exclusive = 4;
  optional uint32 max_string_bytes = 5;
  repeated ConfigEnumOption enum_options = 6;
  optional sint64 integer_minimum = 7;
  optional sint64 integer_maximum = 8;
  optional uint32 min_items = 9;
  optional uint32 max_items = 10;
}
// Additional numeric bounds for one array position; intersect with field bounds.
message ConfigElementConstraints {
  optional double minimum = 1;
  optional double maximum = 2;
  bool minimum_exclusive = 3;
  bool maximum_exclusive = 4;
  optional sint64 integer_minimum = 5;
  optional sint64 integer_maximum = 6;
}
message ConfigArrayElementDescriptor {
  // Presence is required; zero is a valid position.
  optional uint32 index = 1;
  string name = 2;
  ConfigElementConstraints constraints = 3;
}
message ConfigFieldDescriptor {
  string field_id = 1;
  string name = 2;
  string description = 3;
  string group = 4;
  ConfigValueType value_type = 5;
  string unit = 6;
  ConfigConstraints constraints = 7;
  ConfigApplyPolicy apply_policy = 8;
  string safety_condition = 9;
  ConfigValueType element_type = 10;
  repeated ConfigArrayElementDescriptor array_elements = 11;
}
message ConfigDiagnostic {
  string code = 1;
  string field_id = 2;
  string message = 3;
  optional uint32 element_index = 4;
}
message ConfigFieldInfo {
  string field_id = 1;
  ConfigFieldDescriptor field_descriptor = 2;
  ConfigValue effective_value = 3;
  ConfigOverrideStatus override_status = 4;
  ConfigValue saved_override = 5;
  bool pending_init = 6;
  repeated ConfigDiagnostic diagnostics = 7;
}
message ConfigInstanceInfo {
  string plugin_id = 1;
  repeated ConfigFieldInfo fields = 2;
  repeated ConfigDiagnostic diagnostics = 3;
}
message ConfigGetRequest { string plugin_id = 1; }
message ConfigGetResponse {
  ConfigResult result = 1;
  repeated ConfigInstanceInfo instances = 2;
  repeated ConfigDiagnostic diagnostics = 3;
}
message ConfigFieldOperation { string field_id = 1; ConfigOperation operation = 2; ConfigValue value = 3; }
message ConfigSetRequest { string plugin_id = 1; repeated ConfigFieldOperation operations = 2; }
message ConfigSetResponse { ConfigResult result = 1; ConfigInstanceInfo instance = 2; repeated ConfigDiagnostic diagnostics = 3; }
