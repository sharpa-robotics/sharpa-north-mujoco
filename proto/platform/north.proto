// 力矩传感器零漂标定（CANopen 0x2531 操作码2，见文档"CANopen 当前力矩标定协议"）。
// joint_index 对应 TorsoState/TorsoCommand 的关节下标（0~7），仅 0~4（J1/J2/qp/qr/J5）受重力模型
// 覆盖，超出范围直接失败。调用前无需手动失能——服务内部会自动让全身所有电机失能抱闸，保证操作期间
// 全身电机状态同步；理论力矩由插件用当前整机重力模型（含实时头/双臂姿态，见 BodyGravityModel）现算
// g(q) 得到（不再支持调用方直接传入理论力矩），实际写入值见响应的 theoretical_torque_nm。
// 该服务内部会阻塞等待 ~2s 采样完成后再返回，measured_torque_nm 为标定后读取到的实际力矩反馈。
message TorqueCalibRequest {
  Header header      = 1;
  uint32 joint_index = 2;
  reserved 3, 4;               // 曾用于调用方传入的 theoretical_torque_nm / use_gravity_model_torque 开关，已废弃
  reserved "theoretical_torque_nm", "use_gravity_model_torque";
}
message TorqueCalibResponse {
  bool   success               = 1;
  float  measured_torque_nm    = 2;  // 标定后实际力矩反馈，Nm（success=false 时无意义）
  string message                = 3;  // 失败原因 / 备注
  float  theoretical_torque_nm = 4;  // 插件用重力模型现算出的、实际写入的理论力矩，Nm（success=false 时无意义）
}

// 电机标零（CANopen 0x2531 操作码1）。joint_index 对应 TorsoState/TorsoCommand 的关节下标（0~7）；
// 调用前无需手动失能——服务内部会自动让全身所有电机失能抱闸，标零成功后默认自动持久化到 Flash（0x2539）。
// 若持久化失败则整体判定为失败。操作完成后全身保持失能抱闸状态，需另行调用 EnableRequest 才会重新使能。
message ZeroCalibRequest {
  Header header      = 1;
  uint32 joint_index = 2;
}
message ZeroCalibResponse {
  bool   success            = 1;  // 0x2531 标零 SDO + 0x2539 持久化是否都成功
  bool   persisted          = 2;  // 是否已成功持久化到Flash；success=false 时无意义
  float  position_after_deg = 3;  // 标零后电机侧原始角度反馈，供诊断参考
  string message            = 4;
}

