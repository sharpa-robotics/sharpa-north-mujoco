  POWER_OP_SET_MASK = 17;           // 0x11 PWR_SET_MASK
  POWER_OP_GET_STATUS = 18;         // 0x12 PWR_GET_STATUS
  POWER_OP_ALL_ON = 19;             // 0x13 PWR_ALL_ON
  POWER_OP_ALL_OFF = 20;            // 0x14 PWR_ALL_OFF
  POWER_OP_SYS_SLEEP = 32;          // 0x20 SYS_SLEEP
  POWER_OP_SYS_WAKEUP = 33;         // 0x21 SYS_WAKEUP
  POWER_OP_SYS_GET_STATUS = 34;     // 0x22 SYS_GET_STATUS
  POWER_OP_SYS_RESET = 35;          // 0x23 SYS_RESET
  POWER_OP_SYS_SET_HB_PERIOD = 36;  // 0x24 SYS_SET_HB_PERIOD
}

