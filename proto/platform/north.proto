}

message StopTaskCommand {
  int32 status = 1; // Task exit code. Defaults to 0 (success).
}
message ResetConfirmCommand {}
message EnterOtaCommand {}
message ExitOtaCommand {}
message EnterEstopCommand {}
message ExitEstopCommand {}

// Retained for protobuf wire compatibility only. Master control is exposed as
// per-operation request/response services rather than this former pub/sub envelope.
message MasterCommand {
  Header header = 1;
  oneof command {
    StartTaskCommand start_task = 2;
    StopTaskCommand stop_task = 3;
    ResetConfirmCommand reset_confirm = 5;
    SetModeCommand set_mode = 6;
    EnterOtaCommand enter_ota = 7;
    ExitOtaCommand exit_ota = 8;
    SetHealthRequirementCommand set_health_requirement = 9;
    SetSafetyGuardEnabledCommand set_safety_guard_enabled = 10;
    EnterEstopCommand enter_estop = 11;
    ExitEstopCommand exit_estop = 12;
  }
  reserved 4;
}

// Stable result codes for all Master control services. Callers must use this
// field rather than parsing the human-readable message.
enum MasterCommandResult {
  MASTER_COMMAND_RESULT_UNSPECIFIED         = 0;
  MASTER_COMMAND_RESULT_OK                  = 1;
  MASTER_COMMAND_RESULT_INVALID_REQUEST     = 2;
  MASTER_COMMAND_RESULT_INVALID_PHASE       = 3;
  MASTER_COMMAND_RESULT_UNKNOWN_TARGET      = 4;
  MASTER_COMMAND_RESULT_BUSY                = 5;
  MASTER_COMMAND_RESULT_UNAVAILABLE         = 6;
  MASTER_COMMAND_RESULT_HEALTH_CHECK_FAILED = 7;
  MASTER_COMMAND_RESULT_EXECUTION_FAILED    = 8;
  // The response deadline expired. The command may already have executed;
  // callers must observe Master state and must not retry automatically.
  MASTER_COMMAND_RESULT_OUTCOME_UNKNOWN     = 9;
  MASTER_COMMAND_RESULT_INTERNAL_ERROR      = 10;
}

enum MasterTaskHealthLevel {
  MASTER_TASK_HEALTH_NORMAL   = 0;
  MASTER_TASK_HEALTH_DEGRADED = 1;
}

message MasterStateSnapshot {
  MasterPhase           phase             = 1;
  OperationMode         mode              = 2;
  string                task_id           = 3;
  MasterTaskHealthLevel task_health_level = 4;
}

message StartTaskResult { string task_id = 1; }
message StopTaskResult {
  string task_id = 1;
  int32  status  = 2;
}
message SetModeResult { OperationMode requested_mode = 1; }
message SetHealthRequirementResult {
  string            subsystem_id = 1;
  HealthRequirement requirement  = 2;
}
message SetSafetyGuardEnabledResult {
  string guard_id = 1;
  bool   enabled  = 2;
}

enum MasterPhaseTransitionOperation {
  MASTER_PHASE_TRANSITION_OPERATION_UNSPECIFIED = 0;
  MASTER_PHASE_TRANSITION_OPERATION_RESET       = 1;
  MASTER_PHASE_TRANSITION_OPERATION_ENTER_OTA   = 2;
  MASTER_PHASE_TRANSITION_OPERATION_EXIT_OTA    = 3;
  MASTER_PHASE_TRANSITION_OPERATION_ENTER_ESTOP = 4;
  MASTER_PHASE_TRANSITION_OPERATION_EXIT_ESTOP  = 5;
}
message PhaseTransitionResult {
  MasterPhaseTransitionOperation operation = 1;
