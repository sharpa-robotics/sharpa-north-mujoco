// =============================================================================
// Heartbeat (统一心跳)
//
// 与 loader/include/plugin_msg_define.h 的 MsgHeartbeat 字段一一对齐，
// 由各 plugin 通过 BroadcastMsg(eMsgType_Heartbeat_*, MsgHeartbeat) 发布，
// 上层（client/diagnostics）通过 SDK 转 protobuf 后消费。
//
// 设计原则：
//   - 纯数值，不带可变长字符串（详细文本走未来的 Diagnostics 通道）；
//   - 设备 mask 位序按子系统在 docs/heartbeat_spec.md 锁定（32 位起步）；
//   - fault_codes 与 mask 位序一致，0 表示无故障；
//   - 三个 *_rate_hz 对应控制循环 / 状态发布 / 心跳本身三个线程的实测频率。
// =============================================================================
enum HeartbeatMetricKind {
  HEARTBEAT_METRIC_KIND_UNSPECIFIED           = 0;
  HEARTBEAT_METRIC_KIND_TACTILE_FRAME_RATE_HZ = 1;
  HEARTBEAT_METRIC_KIND_LIDAR_FRAME_RATE_HZ   = 2;
  // instance 0 = left eye, 1 = right eye; H.265 access-unit FPS after RTP depayloading/parsing.
  HEARTBEAT_METRIC_KIND_WEBRTC_H265_INPUT_FRAME_RATE_HZ = 3;
}

message HeartbeatMetric {
  uint32 kind     = 1;  // HeartbeatMetricKind numeric value; unknown future kinds may be forwarded
  uint32 instance = 2;
  float  value    = 3;
}

message Heartbeat {
  Header         header              = 1;
  string         subsystem           = 2;   // "arm_left" / "arm_right" / "torso" / "chassis" / "hand_left" / ...
  uint32         seq                 = 3;   // 子系统内单调递增
  LifecyclePhase phase               = 4;
  uint32         severity            = 5;   // 0=OK 1=WARN 2=ERROR 3=FATAL
  ControlMode    control_mode        = 6;   // 通用运行控制模式；与 MsgHeartbeat 字段顺序一致
  // 设备级 mask（32 位起步，bit i = 设备 i）
  uint32         expected_mask       = 7;
  uint32         online_mask         = 8;
  uint32         fault_mask          = 9;
  repeated uint32 fault_codes        = 10 [packed = true];  // 与 mask 同位序，长度 ≤ 32
  uint32         error_code          = 11;  // 子系统级"最严重"错误码
  // L1 + 三线程心跳速率
  float          feedback_age_ms     = 12;
  float          ctrl_rate_hz        = 13;
  float          state_rate_hz       = 14;
  float          pub_rate_hz         = 15;
  float          bus_busload_pct     = 16;  // NaN = 未实现
  // 可选诊断指标；不参与 phase/severity/verdict 判定。
  repeated HeartbeatMetric metrics   = 17;
  uint32         enabled_mask        = 18;  // bit i = 伺服使能反馈；未实现保持 0
}

enum HardwareHealthVerdict {
  HARDWARE_HEALTH_OK         = 0;
  HARDWARE_HEALTH_WARNING    = 1;
  HARDWARE_HEALTH_FAULT      = 2;
  HARDWARE_HEALTH_STALE      = 3;
  HARDWARE_HEALTH_NEVER_SEEN = 4;
}

enum HealthRequirement {
  UNSPECIFIED = 0;
  OK          = 1;
  WARNING     = 2;
  OFF         = 3;
}

message HardwareHealth {
  Heartbeat             heartbeat          = 1;
  uint64                receive_age_ms     = 2;
  HardwareHealthVerdict verdict            = 3;
  HealthRequirement     health_requirement = 4;
}

message SafetyGuardStatus {
  string guard_id = 1;
  bool   enabled  = 2;
}

// Host CPU/memory diagnostics sampled by Master. Missing readings are NaN.
// This is not a hardware subsystem and does not affect worst_severity or verdicts.
message HostResourceMetrics {
  float cpu_temp_c   = 1;  // Celsius
  float cpu_load_pct = 2;  // 0-100 busy percent from /proc/stat aggregate cpu line
  float mem_used_pct = 3;  // 0-100 = 100 * (1 - MemAvailable / MemTotal)
  repeated float cpu_core_load_pct = 4;  // per-core busy% from /proc/stat cpuN; index = core id
}

// WholeBodyCommand Loader channel. Numeric values match Master WholeBodyCommandSource.
enum WholeBodyCommandChannel {
  WHOLE_BODY_COMMAND_CHANNEL_UNSPECIFIED   = 0;
  WHOLE_BODY_COMMAND_CHANNEL_TELEOPERATION = 1;
  WHOLE_BODY_COMMAND_CHANNEL_INFERENCE     = 2;
  WHOLE_BODY_COMMAND_CHANNEL_AUTOMATION    = 3;
  WHOLE_BODY_COMMAND_CHANNEL_UNIVERSAL     = 4;
}

// Per-channel WholeBodyCommand rates sampled by Master. Diagnostic only; not a
// subsystem and does not affect worst_severity or verdicts.
message WholeBodyCommandChannelRate {
  uint32 channel     = 1;  // WholeBodyCommandChannel numeric value; unknown future channels may be forwarded
  float  rx_hz       = 2;  // commands that passed size checks
  float  accepted_hz = 3;  // authorized and FanOut succeeded
}

// Master 在一次评估中生成的整机硬件健康快照。
message SystemHardwareHealth {
  Header                              header          = 1;
  uint32                              worst_severity  = 2;  // Max effective severity among health_requirement != off; 0 if none are open.
  repeated HardwareHealth             subsystems      = 3;
  MasterStatus                        master_status   = 4;
  repeated SafetyGuardStatus          safety_guards   = 5;
  HostResourceMetrics                 host           = 6;
  repeated WholeBodyCommandChannelRate command_rates = 7;
}

enum OperationMode {
  OPERATION_MODE_UNSPECIFIED   = 0;
  OPERATION_MODE_TELEOPERATION = 1;
  OPERATION_MODE_INFERENCE     = 2;
  OPERATION_MODE_AUTOMATION    = 3;
}



enum MasterPhase {
  MASTER_PHASE_UNSPECIFIED = 0;
  MASTER_PHASE_INIT        = 1;
  MASTER_PHASE_STANDBY     = 2;
  MASTER_PHASE_RUNNING     = 3;
  MASTER_PHASE_ERROR       = 4;
  MASTER_PHASE_OTA         = 5;
  MASTER_PHASE_ESTOP       = 6;
}



message StartTaskCommand {
  string task_id = 1;
  reserved 2;
}

