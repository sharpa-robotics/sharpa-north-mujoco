# LiDAR-only fixture for attachment and raycast integration tests.

[simulation]
model=../../mjcf/sharpa-assets/d01/d01-w/ha1.2/mjcf/NTH-HA1-scene-precise-collision.xml

[devices.chest_lidar_front]
enabled=true
driver=hesai_ftx140
parent_body=lower_body_link_5
site_name=ray_origin
sensor_model=../../mjcf/sensors/lidar/hesai_ftx140_frame.xml
mount_pos=-2.94958e-07,-0.0803,0.11755
mount_quat=-0.707106781,0,0,0.707106781
calibration_file=../../resources/lidar/calibration/FTX140_angle_calib_file.csv
raycast_exclude_meshes=visual_old_mesh_meshes_torso__torso_FTX_link,visual_old_mesh_meshes_torso__torso_base_link,visual_old_mesh_meshes_torso__torso_base_link002,visual_old_mesh_meshes_torso__torso_base_link003
scan_rate_hz=10
min_range_m=0.1
max_range_m=60
raycast_threads=1
bind_ip=127.0.0.1
bind_port=45980
peer_ip=127.0.0.1
peer_port=9180

